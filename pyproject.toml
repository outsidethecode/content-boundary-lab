[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "content-boundary-lab"
version = "0.0.0"
description = "Independent educational laboratory for security code review and remediation."
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.141.1",
    "PyJWT==2.15.1",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-m", "not clean_env"]
markers = ["clean_env: exact installed-set check; run with `-m clean_env` in a fresh venv built from requirements.lock"]
